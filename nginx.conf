server {
    listen 8080;
    server_name _;

    root /app/backend/public;

    index index.php index.html;

    # Handle PHP files
    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/backend/public/$fastcgi_script_name;
    }

    # Serve React build for non-API routes
    location / {
        try_files $uri /app/frontend/web/build/index.html;
    }

    # API routing
    location /api/ {
        try_files $uri =404;
    }
}
